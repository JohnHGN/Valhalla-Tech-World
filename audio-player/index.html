<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03131b">
  <title>Valhalla Audio Player</title>
  <link rel="stylesheet" href="player.css?v=20261112-glass-refresh-01">
</head>
<body>
  <main class="player-shell" id="valhallaPlayer" aria-label="پخش‌کننده صوتی وال‌هالا"
        >
    <img class="player-skin" src="assets/valhalla-player-base.png" alt="" draggable="false">
    <img class="podcast-logo" id="podcastLogo" alt="لوگوی پادکست" draggable="false" hidden>

    <div class="brand">VALHALLA AUDIO</div>
    <button class="playing-status" id="statusButton" type="button" aria-label="تغییر وضعیت پخش">
      <span class="status-dot"></span><span id="statusText">متوقف</span>
    </button>

    <div class="track-title" id="trackTitle" aria-live="polite">هیچ پادکستی انتخاب نشده</div>
    <canvas class="equalizer" id="equalizer" aria-label="اکولایزر زنده"></canvas>

    <div class="timeline">
      <input id="seekBar" class="seek" type="range" min="0" max="1000" value="0"
             aria-label="موقعیت پخش">
      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <div class="controls" aria-label="کنترل‌های پخش">
      <label class="control speed-control" title="سرعت پخش">
        <svg class="hud-icon speed-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/><path d="M12 7v5l3.5 2"/><path d="M16.5 3.8h4v4"/></svg>
        <select id="speedSelect" aria-label="سرعت پخش">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2.0x</option>
        </select>
        <svg class="hud-icon chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6"/></svg>
      </label>

      <button class="control sleep-control" id="sleepButton" type="button" title="توقف خودکار">
        <svg class="hud-icon control-icon sleep-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/><path d="M4.8 5.8 3.5 4.5"/></svg>
        <span class="sleep-label"><span>توقف خودکار</span><small id="sleepValue">خاموش</small></span>
        <svg class="hud-icon chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <button class="control skip-control rewind" id="rewindButton" type="button" aria-label="۱۵ ثانیه عقب">
        <span class="skip-icon-wrap">
          <svg class="hud-icon skip-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M8 7H3.5V2.5"/><path d="M4 7a8.5 8.5 0 1 1-1 8"/></svg>
          <strong>15</strong>
        </span>
      </button>
      <button class="control round-control previous" id="previousButton" type="button" aria-label="قطعه قبلی">
        <svg class="hud-icon transport-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M6 5v14"/><path d="m18 6-9 6 9 6z"/></svg>
      </button>
      <button class="control play-control" id="playButton" type="button" aria-label="پخش">
        <span class="play-symbol" id="playSymbol" aria-hidden="true"></span>
      </button>
      <button class="control round-control next" id="nextButton" type="button" aria-label="قطعه بعدی">
        <svg class="hud-icon transport-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M18 5v14"/><path d="m6 6 9 6-9 6z"/></svg>
      </button>
      <button class="control skip-control forward" id="forwardButton" type="button" aria-label="۳۰ ثانیه جلو">
        <span class="skip-icon-wrap">
          <svg class="hud-icon skip-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M16 7h4.5V2.5"/><path d="M20 7a8.5 8.5 0 1 0 1 8"/></svg>
          <strong>30</strong>
        </span>
      </button>

      <label class="control volume-control" title="بلندی صدا">
        <svg class="hud-icon volume-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M4 10v4h3.5l4.5 3.5v-11L7.5 10z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.85"
               aria-label="بلندی صدا">
      </label>

      <div class="control utility-control">
        <button id="repeatButton" type="button" aria-label="تکرار خاموش" title="تکرار">
          <svg class="hud-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 0 1 4"/></svg>
        </button>
        <i></i>
        <button id="shareButton" type="button" aria-label="اشتراک‌گذاری" title="اشتراک‌گذاری">
          <svg class="hud-icon utility-icon share-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><circle cx="18" cy="5" r="2.2"/><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="m8 11 7.8-4.7M8 13l7.8 4.7"/></svg>
        </button>
      </div>
    </div>

    <audio id="audioElement" preload="metadata"></audio>
    <div class="player-message" id="playerMessage" role="status" aria-live="polite"></div>
  </main>

  <section class="podcast-library" id="podcastLibrary" aria-label="عناوین پادکست‌ها">
    <button class="podcast-library-toggle" id="podcastLibraryToggle"
            type="button" aria-expanded="false" aria-controls="podcastListPanel">
      <span class="podcast-library-heading">عناوین پادکست‌ها</span>
      <span class="podcast-library-chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="podcast-list-panel" id="podcastListPanel" hidden>
      <div class="podcast-list" id="podcastList" aria-live="polite">
        <p class="podcast-list-empty">در حال بارگذاری عناوین پادکست‌ها...</p>
      </div>
    </div>
  </section>
  <script src="player.js"></script>
  <script src="playlist.js"></script>
</body>
</html>
